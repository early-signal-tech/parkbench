name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: parkbench-darwin-arm64
          - os: windows-latest
            artifact: parkbench-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Build binary
        run: go build -o ${{ matrix.artifact }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4.3.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.1.7

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            parkbench-darwin-arm64/parkbench-darwin-arm64
            parkbench-windows-amd64.exe/parkbench-windows-amd64.exe
          draft: false
          prerelease: false
